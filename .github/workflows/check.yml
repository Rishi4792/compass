name: compass checks
on:
  push:
    branches: [main, v1]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gate suite (promise checks + checks born from breaks; word budget)
        run: node plugins/compass/scripts/check
